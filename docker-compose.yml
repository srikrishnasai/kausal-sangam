services:
  db:
    image: postgres:17-alpine
    container_name: kausal-sangam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kausal_sangam
    ports:
      - "5432:5432"
    volumes:
      - kausal-sangam-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kausal_sangam"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kausal-sangam-pgdata:
